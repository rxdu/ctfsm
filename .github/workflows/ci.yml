name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    name: build-test (${{ matrix.compiler }})
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ clang ninja-build
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned clang-format
        run: python3 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: Check formatting
        run: |
          find include test examples \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 .venv/bin/clang-format --dry-run --Werror
